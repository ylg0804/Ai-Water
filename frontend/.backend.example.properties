# Copy to .backend.local.properties. This local file is ignored by Git.
# Configure only the backend; never use VITE_ prefixes for credentials.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/water_moniter?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.sql.init.mode=never

# Replace these values before deployment.
admin.username=admin
admin.password=
admin.session-ttl-seconds=28800
waterflow.websocket-origins=http://127.0.0.1:5173,http://localhost:5173

# Required for cloud extraction and local replay; use the installed executable path.
waterflow.ffmpeg-path=ffmpeg
waterflow.model-path=models/yolo_waterflow_universal.onnx
waterflow.debris-model-path=models/yolo_debris.onnx
waterflow.snapshot-dir=snapshots

# Set these only when the camera account has authorized the application.
ezviz.base-url=https://open.ys7.com
ezviz.app-key=
ezviz.app-secret=

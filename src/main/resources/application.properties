spring.application.name=water
# Default YOLO output has 4 box channels plus 80 class channels.
# Change this value when the model class dimension is upgraded.
waterflow.class-count=80
# Override with a filesystem model path when deploying outside the jar.
waterflow.model-path=models/yolo_waterflow_universal.onnx
# Sliding median window size per device (positive odd number).
waterflow.smoothing-window=5
# Default inference interval in seconds for the device scheduler.
waterflow.infer-interval-seconds=60

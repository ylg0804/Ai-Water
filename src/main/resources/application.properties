spring.application.name=water

# MySQL 8 persistence. Keep disabled for local/model-only runs; set MYSQL_URL
# and MYSQL_SCHEMA_INIT=always in deployment to enable database persistence.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/water_moniter?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=${MYSQL_SCHEMA_INIT:never}
# Simple administrator login for the taskbook API; override in deployment.
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:change-me}
admin.session-ttl-seconds=28800
# Same-origin cookie authenticates browser WebSocket handshakes; API requests use Bearer tokens.
waterflow.websocket-origins=${WEBSOCKET_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080}
server.forward-headers-strategy=framework
# Default YOLO output has 4 box channels plus 80 class channels.
# Change this value when the model class dimension is upgraded.
waterflow.class-count=80
# Override with a filesystem model path when deploying outside the jar.
waterflow.model-path=models/yolo_waterflow_universal.onnx
waterflow.debris-model-path=models/yolo_debris.onnx
waterflow.debris-class-count=1
waterflow.debris-min-confidence=0.5
# Blank labels default to floating_debris (single class) or class_N (multiple classes).
waterflow.debris-labels=
waterflow.inference-workers=2
waterflow.invalid-frame-template-dir=
waterflow.test-source.enabled=false
waterflow.test-source.root=test-videos
waterflow.snapshot-dir=snapshots
# Sliding median window size per device (positive odd number).
waterflow.smoothing-window=5
# Default inference interval in seconds for the device scheduler.
waterflow.infer-interval-seconds=60
waterflow.scheduler-tick-ms=1000
# ffmpeg must be installed on the server; use an absolute path in production.
# Override with FFMPEG_PATH when ffmpeg is not on PATH.
waterflow.ffmpeg-path=${FFMPEG_PATH:ffmpeg}

# ===== 萤石云开放平台（open.ys7.com 控制台 -> 我的应用）=====
# Credentials are intentionally externalized; set EZVIZ_APP_KEY and
# EZVIZ_APP_SECRET before starting the application. Never commit them here.
ezviz.base-url=https://open.ys7.com
ezviz.app-key=${EZVIZ_APP_KEY:}
ezviz.app-secret=${EZVIZ_APP_SECRET:}
